<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Our Classes – Yoga Studio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5">
    <h1 class="text-center mb-5">Our Classes</h1>
    
    <div class="row g-4">
      <div class="col-md-4">
        <div class="card">
          <img src="images/class1.jpg" class="card-img-top" alt="Hatha Yoga">
          <div class="card-body">
            <h5 class="card-title">Beginner Yoga</h5>
            <p class="card-text">Perfect for newcomers. Learn foundational poses and breathing techniques.</p>
          </div>
        </div>
      </div>
      
      <div class="col-md-4">
        <div class="card">
          <img src="images/class2.jpg" class="card-img-top" alt="Vinyasa Flow">
          <div class="card-body">
            <h5 class="card-title">Evening Flow</h5>
            <p class="card-text">Unwind after a long day with this calming and revitalizing session.</p>
          </div>
        </div>
      </div>
      
      <div class="col-md-4">
        <div class="card">
          <img src="images/class3.jpg" class="card-img-top" alt="Restorative Yoga">
          <div class="card-body">
            <h5 class="card-title">Power Yoga</h5>
            <p class="card-text">Challenge your strength and stamina in this high-energy class.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
